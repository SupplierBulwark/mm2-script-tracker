  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" fill="#ffffff" font-weight="bold">
    <tspan x="600" dy="0">Murder Mystery 2 Scripts</tspan>
  </text>

  <text x="600" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Pluggable script tracker for the Murder Mystery 2 scripting ecosystem —</tspan>
    <tspan x="600" dy="30">organize, tag, and version your scrip…</tspan>
  </text>
